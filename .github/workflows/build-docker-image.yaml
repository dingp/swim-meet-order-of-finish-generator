name: Build Docker Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - generate_oof_1evt_1pg.py
      - generate_oof_2evt_1pg.py
      - templates/**
      - example/**
      - .github/workflows/build-docker-image.yaml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - generate_oof_1evt_1pg.py
      - generate_oof_2evt_1pg.py
      - templates/**
      - example/**
      - .github/workflows/build-docker-image.yaml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: oof-generator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

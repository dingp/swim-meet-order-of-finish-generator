apiVersion: v1
kind: Service
metadata:
  name: {{ include "swim-meet-order-of-finish-generator.serviceName" . }}
  labels:
    {{- include "swim-meet-order-of-finish-generator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "swim-meet-order-of-finish-generator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
